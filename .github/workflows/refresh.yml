name: Refresh data
on:
  schedule: [{ cron: "17 9 * * 1" }]   # Mondays 09:17 UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install duckdb numpy
      - name: Download OpenPowerlifting
        run: |
          curl -fsSL -o opl.zip https://openpowerlifting.gitlab.io/opl-csv/files/openpowerlifting-latest.zip
          unzip -q opl.zip && mv openpowerlifting-*/openpowerlifting-*.csv opl.csv
      - run: python build.py opl.csv
      - name: Download OpenWeightlifting
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/euanwm/OpenWeightlifting.git owl
          git -C owl sparse-checkout set event_data
          python owl_normalize.py owl/event_data owl.csv
      - run: python build_wl.py owl.csv
      - run: python gen_standards.py && python gen_api.py
      - name: Sanity check
        run: |
          python - <<'PY'
          import json; d = json.load(open('docs/data.json'))
          n = d['meta']['lifters']
          assert n['M_total'] > 150000 and n['F_total'] > 70000, n
          print(n, d['meta']['latest_meet'])
          PY
      - name: Commit if changed
        run: |
          git diff --quiet docs/ && { echo "no change"; exit 0; }
          git config user.name "Tinker (bot)"; git config user.email "tinker@prestonbjensen.com"
          git add docs/data*.json docs/wl docs/standards docs/api docs/sitemap.xml && git commit -m "Data refresh: $(python -c "import json;print(json.load(open('docs/data.json'))['meta']['latest_meet'])")" && git push
      - name: Ping IndexNow (Bing, Yandex, ...)
        run: |
          python - <<'PY'
          import json, re, urllib.request
          key = open('.indexnow-key').read().strip()
          urls = re.findall(r'<loc>([^<]+)</loc>', open('docs/sitemap.xml').read())
          body = json.dumps({"host": "strengthpercentile.com", "key": key, "keyLocation": f"https://strengthpercentile.com/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body, headers={'content-type': 'application/json; charset=utf-8'})
          try: print(urllib.request.urlopen(req).status)
          except Exception as e: print('indexnow:', e)
          PY
